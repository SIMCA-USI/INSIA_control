/**:
  can_ravo:
    ros__parameters:
      log_level: 0
      local: False # Poner a true si no esta conectado al vehiculo para poder ver laa conexion de los topics
      connection_mode: tcp
      ip: 192.168.0.9
      port: 10001
      extend: True
  can_control:
    ros__parameters:
      log_level: 0
      local: False # Poner a true si no esta conectado al vehiculo para poder ver laa conexion de los topics
      connection_mode: tcp
      ip: 192.168.0.7
      port: 10001
      extend: False
  CANADAC_Acelerador:
    ros__parameters:
      log_level: 10
      cobid: 0x605
      can: can_control
  Telemetry:
    ros__parameters:
      log_level: 0
      dictionary: ravo_dictionary.yaml
      can_recepcion: 'can_ravo'
  EPOS4_Volante: # Usar este con motor pequeño
    ros__parameters:
      log_level: 20
      cobid: 0x603
      driver_type: epos
      mode: PM #CST: Cyclic Synchronous Torque Mode, PPM: Profile position mode TODO: CST para volante imiev, para EC90 usar PPM
      auto_fault_reset: True
      speed: 200
      dictionary: epos_dictionary.yaml
      can: can_control
      digital_outputs: 4
      factor: 550 #Para reductora de 156 #2500 para reductora de 450
  #  EPOS4_Volante: # Usar este con motor negro
  #    ros__parameters:
  #      log_level: 0
  #      cobid: 0x602
  #      driver_type: epos4
  #      mode: CST #CST: Cyclic Synchronous Torque Mode, PPM: Profile position mode TODO: CST para volante imiev, para EC90 usar PPM
  #      auto_fault_reset: False
  #      speed: 2000
  #      dictionary: epos4_dictionary.yaml
  #      can: can_control
  #      digital_outputs: 2
  BrakeCAN:
    ros__parameters:
      log_level: 0
      cobid: 0x601
      can: can_control
  BrushesDriver:
    ros__parameters:
      log_level: 0
      cobid: 0x60A
      can: can_control
  Brake:
    ros__parameters:
      log_level: 0
  Steering:
    ros__parameters:
      log_level: 0
  Throttle:
    ros__parameters:
      log_level: 0
  Brushes:
    ros__parameters:
      log_level: 0
  Longitudinal_Control:
    ros__parameters:
      log_level: 0
      throttle:
        kp: 2.0
        ti: 1.5
        td: 0.0
        windup: 0.3
      brake:
        #follow-me
#        kp: 6.
#        ti: 4.
#        td: 0.
        #normal
        kp: 1.
        ti: 0.
        td: 0.
        windup: 0.65
      max_speed: 10
      static_brake: 0.75
  Lateral_Control:
    ros__parameters:
      log_level: 0
      steering:
        # Follow
#        kp: 5.
#        ti: 0.
#        td: 0.
        # A6
        #kp: 10
        #ti: 8
        #td: 0.03
        # Pista
        kp: 1.0
        ti: 1.0
        td: 0.0
        windup: 0.0
  Decision:
    ros__parameters:
      log_level: 0
      emergency_stop_mode: 1
      wp:
        mode: 'wheels'
        ttl: 1
      tele:
        mode: 'wheels'
        ttl: 0
  PathPlanning:
    ros__parameters:
      log_level: 0